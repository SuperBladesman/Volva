# Völva 4.1 environment. Versions pinned to those used for the 4.1.0 test run
# (42/42 tests passed; also passes with numpy 1.26 / scipy 1.11 / lmfit 1.2).
#   conda env create -f environment.yml
#   conda activate volva41
name: volva41
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.4.4
      - scipy==1.17.1
      - matplotlib==3.10.9
      - lmfit==1.3.4
      - PySide6==6.11.2
      - pytest
      - pyinstaller
