name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt needs without a display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install the package as a user would
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -c "import volva, numpy, scipy, lmfit, PySide6; print('volva', volva.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| lmfit', lmfit.__version__, '| PySide6', PySide6.__version__)"
      - name: Test suite
        run: python -m pytest -q
      - name: Desktop application, offscreen
        run: python tests/gui_smoke.py
      - name: Command line, end to end
        shell: bash
        run: |
          volva-cli calibrate examples/SYNTHETIC_LaB6_standard.xy -o profile.json
          volva-cli analyse examples/SYNTHETIC_CeO2_Lvol34nm.xy --profile profile.json -o results
          test -s results/SYNTHETIC_CeO2_Lvol34nm_report.txt

  pinned:
    name: pinned environment (requirements.txt) / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the versions in requirements.txt, then Völva without dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install --no-deps .
      - name: Test suite
        run: python -m pytest -q
      - name: Desktop application, offscreen
        run: python tests/gui_smoke.py
